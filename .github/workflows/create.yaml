# Why GitHub Secrets Are Important

Never hardcode credentials like:

aws-secret-access-key: ABC123
```

This is insecure.

Use:

${{ secrets.AWS_SECRET_ACCESS_KEY }}
```

instead.

Benefits:

* Secure storage
* Encrypted secrets
* Safe CI/CD automation

---

# Production Best Practices

Instead of long-term AWS keys:

* Use IAM Roles
* Use OpenID Connect (OIDC)

Benefits:

* More secure
* No static credentials
* Better access control

