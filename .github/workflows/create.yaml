# How to Run

1. Store AWS credentials in GitHub Secrets
2. Push Terraform code to repository
3. Open Actions tab
4. Select `create runner`
5. Click `Run workflow`
6. Observe Terraform execution logs
7. Verify infrastructure creation in AWS Console

